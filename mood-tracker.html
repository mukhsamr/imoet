<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Tracker 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #fffaf5;
  --soft-white: #ffffff;
  --pink: #f472b6;
  --pink-light: #fce7f3;
  --pink-pale: #fdf2f8;
  --purple: #c084fc;
  --purple-light: #f3e8ff;
  --yellow: #fbbf24;
  --yellow-light: #fef9c3;
  --blue: #60a5fa;
  --blue-light: #eff6ff;
  --green: #34d399;
  --green-light: #ecfdf5;
  --red: #f87171;
  --red-light: #fef2f2;
  --orange: #fb923c;
  --orange-light: #fff7ed;
  --text: #3b1f2b;
  --text-mid: #8b5a6e;
  --text-soft: #c4a0b4;
  --shadow: 0 8px 32px rgba(244,114,182,0.15);
  --shadow-sm: 0 3px 12px rgba(244,114,182,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 4rem;
  position: relative;
  overflow-x: hidden;
}

/* BG PATTERN */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 20%, #fce7f380 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, #f3e8ff60 0%, transparent 40%),
    radial-gradient(circle at 60% 10%, #fef9c340 0%, transparent 30%);
  pointer-events: none;
  z-index: 0;
}

.container { position: relative; z-index: 1; width: 100%; max-width: 480px; }

/* HEADER */
.header { text-align: center; margin-bottom: 2rem; }
.header-title {
  font-family: 'Pacifico', cursive;
  font-size: 32px;
  color: var(--text);
  margin-bottom: 0.3rem;
}
.header-sub {
  font-size: 13px;
  color: var(--text-soft);
  font-weight: 700;
  letter-spacing: 0.5px;
}
.date-chip {
  display: inline-block;
  background: var(--pink-light);
  color: var(--pink);
  font-size: 12px;
  font-weight: 800;
  padding: 4px 14px;
  border-radius: 20px;
  margin-top: 8px;
  letter-spacing: 0.3px;
}

/* CARD BASE */
.card {
  background: var(--soft-white);
  border-radius: 24px;
  padding: 1.5rem;
  box-shadow: var(--shadow);
  margin-bottom: 1.25rem;
  border: 1.5px solid #fce7f3;
}

.card-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--text-soft);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 1rem;
}

/* MOOD GRID */
.mood-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.mood-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 14px 8px;
  border-radius: 18px;
  border: 2px solid transparent;
  background: var(--cream);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), border-color 0.15s, background 0.15s;
  position: relative;
  outline: none;
}
.mood-btn:hover { transform: scale(1.08) translateY(-2px); }
.mood-btn.active { border-color: currentColor; }

.mood-emoji { font-size: 28px; line-height: 1; }
.mood-label { font-size: 10px; font-weight: 800; color: var(--text-mid); letter-spacing: 0.3px; }

.mood-btn.m-happy    { --mc: #fbbf24; } .mood-btn.m-happy.active    { background: var(--yellow-light); border-color: var(--yellow); }
.mood-btn.m-love     { --mc: #f472b6; } .mood-btn.m-love.active     { background: var(--pink-light);   border-color: var(--pink); }
.mood-btn.m-excited  { --mc: #fb923c; } .mood-btn.m-excited.active  { background: var(--orange-light);  border-color: var(--orange); }
.mood-btn.m-calm     { --mc: #60a5fa; } .mood-btn.m-calm.active     { background: var(--blue-light);   border-color: var(--blue); }
.mood-btn.m-sad      { --mc: #818cf8; } .mood-btn.m-sad.active      { background: var(--purple-light); border-color: var(--purple); }
.mood-btn.m-anxious  { --mc: #34d399; } .mood-btn.m-anxious.active  { background: var(--green-light);  border-color: var(--green); }
.mood-btn.m-tired    { --mc: #94a3b8; } .mood-btn.m-tired.active    { background: #f1f5f9; border-color: #94a3b8; }
.mood-btn.m-angry    { --mc: #f87171; } .mood-btn.m-angry.active    { background: var(--red-light);    border-color: var(--red); }

/* RESPONSE BOX */
.response-box {
  border-radius: 18px;
  padding: 1.25rem 1.25rem 1rem;
  margin-top: 0;
  animation: slideIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  display: none;
}
.response-box.show { display: block; }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.resp-emoji { font-size: 36px; display: block; margin-bottom: 8px; }
.resp-title { font-family: 'Pacifico', cursive; font-size: 18px; margin-bottom: 6px; }
.resp-body  { font-size: 13px; font-weight: 600; line-height: 1.75; color: var(--text-mid); }
.resp-tip   {
  display: inline-block;
  margin-top: 10px;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: 0.3px;
}

/* INTENSITY SLIDER */
.slider-wrap { margin-top: 1rem; }
.slider-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.slider-label { font-size: 12px; color: var(--text-soft); font-weight: 700; min-width: 28px; text-align: center; }
input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  height: 6px;
  border-radius: 6px;
  background: linear-gradient(to right, var(--pink) 0%, var(--pink) var(--val, 60%), #fce7f3 var(--val, 60%), #fce7f3 100%);
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--pink);
  box-shadow: 0 2px 8px rgba(244,114,182,0.4);
  cursor: pointer;
  transition: transform 0.15s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
.intensity-val {
  font-family: 'Pacifico', cursive;
  font-size: 15px;
  color: var(--pink);
  min-width: 32px;
  text-align: center;
}

/* NOTE INPUT */
.note-input {
  width: 100%;
  border: 1.5px solid #fce7f3;
  border-radius: 14px;
  padding: 12px 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  background: var(--cream);
  resize: none;
  outline: none;
  transition: border-color 0.15s;
  height: 80px;
}
.note-input:focus { border-color: var(--pink); background: #fff; }
.note-input::placeholder { color: var(--text-soft); }

/* SAVE BUTTON */
.btn-save {
  width: 100%;
  padding: 14px;
  border-radius: 50px;
  border: none;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 0.3px;
  box-shadow: 0 4px 20px rgba(244,114,182,0.35);
  transition: transform 0.15s, box-shadow 0.15s;
  margin-top: 0.25rem;
}
.btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(244,114,182,0.4); }
.btn-save:active { transform: scale(0.97); }
.btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* HISTORY */
.history-empty {
  text-align: center;
  padding: 1.5rem 0;
  color: var(--text-soft);
  font-size: 13px;
  font-weight: 700;
}
.history-empty span { font-size: 28px; display: block; margin-bottom: 8px; }

.log-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px dashed #fce7f3;
  animation: slideIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
.log-item:last-child { border-bottom: none; }
.log-emoji-wrap {
  width: 44px; height: 44px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.log-info { flex: 1; }
.log-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.log-mood-name { font-size: 13px; font-weight: 800; color: var(--text); }
.log-time { font-size: 11px; color: var(--text-soft); font-weight: 700; }
.log-bar-wrap { margin-top: 4px; height: 5px; background: #fce7f3; border-radius: 5px; overflow: hidden; }
.log-bar { height: 100%; border-radius: 5px; background: linear-gradient(to right, var(--pink), var(--purple)); }
.log-note { font-size: 12px; color: var(--text-mid); font-weight: 600; margin-top: 4px; font-style: italic; }

/* STATS ROW */
.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
.stat-card {
  background: var(--soft-white);
  border-radius: 18px;
  padding: 1rem 0.75rem;
  text-align: center;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid #fce7f3;
}
.stat-val { font-family: 'Pacifico', cursive; font-size: 22px; color: var(--pink); }
.stat-lbl { font-size: 10px; font-weight: 800; color: var(--text-soft); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; }

/* STREAK BADGE */
.streak-banner {
  background: linear-gradient(135deg, #fce7f3, #f3e8ff);
  border-radius: 18px;
  padding: 1rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1.25rem;
  border: 1.5px solid var(--pink-light);
}
.streak-fire { font-size: 32px; }
.streak-text { flex: 1; }
.streak-num { font-family: 'Pacifico', cursive; font-size: 18px; color: var(--text); }
.streak-sub { font-size: 12px; color: var(--text-mid); font-weight: 700; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text);
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 22px;
  border-radius: 50px;
  z-index: 999;
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* CLEAR BTN */
.btn-clear {
  background: none; border: none;
  font-family: 'Nunito', sans-serif;
  font-size: 11px; font-weight: 800;
  color: var(--text-soft);
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
  float: right;
}
.btn-clear:hover { color: var(--red); }

/* Custom cute cursor */
body, * {
  cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMicgaGVpZ2h0PSczMicgdmlld0JveD0nMCAwIDMyIDMyJz48dGV4dCB5PScyNicgZm9udC1zaXplPScyNic+8J+MuDwvdGV4dD48L3N2Zz4=") 12 28, auto !important;
}
button, a, [onclick], input, textarea, select, label {
  cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMicgaGVpZ2h0PSczMicgdmlld0JveD0nMCAwIDMyIDMyJz48dGV4dCB5PScyNicgZm9udC1zaXplPScyNic+4pyoPC90ZXh0Pjwvc3ZnPg==") 12 28, pointer !important;
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <p class="header-title">Mood Tracker 🌸</p>
    <p class="header-sub">gimana perasaan kamu hari ini?</p>
    <span class="date-chip" id="date-chip">📅 loading...</span>
  </div>

  <!-- STATS -->
  <div class="stats-row" id="stats-row">
    <div class="stat-card"><div class="stat-val" id="stat-total">0</div><div class="stat-lbl">Total Log</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-today">0</div><div class="stat-lbl">Hari Ini</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-fav">—</div><div class="stat-lbl">Favorit</div></div>
  </div>

  <!-- STREAK -->
  <div class="streak-banner" id="streak-banner">
    <span class="streak-fire">🔥</span>
    <div class="streak-text">
      <div class="streak-num" id="streak-num">0 hari</div>
      <div class="streak-sub">streak check-in berturut-turut</div>
    </div>
  </div>

  <!-- MOOD PICKER -->
  <div class="card">
    <p class="card-title">✨ Pilih mood kamu</p>
    <div class="mood-grid">
      <button class="mood-btn m-happy"   onclick="selectMood(this,'happy')"   data-mood="happy">   <span class="mood-emoji">😄</span><span class="mood-label">Happy</span>   </button>
      <button class="mood-btn m-love"    onclick="selectMood(this,'love')"    data-mood="love">    <span class="mood-emoji">🥰</span><span class="mood-label">Sayang</span>  </button>
      <button class="mood-btn m-excited" onclick="selectMood(this,'excited')" data-mood="excited"> <span class="mood-emoji">🤩</span><span class="mood-label">Excited</span> </button>
      <button class="mood-btn m-calm"    onclick="selectMood(this,'calm')"    data-mood="calm">    <span class="mood-emoji">😌</span><span class="mood-label">Tenang</span>  </button>
      <button class="mood-btn m-sad"     onclick="selectMood(this,'sad')"     data-mood="sad">     <span class="mood-emoji">😢</span><span class="mood-label">Sedih</span>   </button>
      <button class="mood-btn m-anxious" onclick="selectMood(this,'anxious')" data-mood="anxious"> <span class="mood-emoji">😰</span><span class="mood-label">Cemas</span>   </button>
      <button class="mood-btn m-tired"   onclick="selectMood(this,'tired')"   data-mood="tired">   <span class="mood-emoji">😴</span><span class="mood-label">Ngantuk</span> </button>
      <button class="mood-btn m-angry"   onclick="selectMood(this,'angry')"   data-mood="angry">   <span class="mood-emoji">😤</span><span class="mood-label">Kesal</span>   </button>
    </div>

    <!-- RESPONSE -->
    <div class="response-box" id="response-box"></div>

    <!-- INTENSITY -->
    <div class="slider-wrap" id="slider-wrap" style="display:none">
      <p class="card-title" style="margin-bottom:4px">💫 Seberapa kuat?</p>
      <div class="slider-row">
        <span class="slider-label">😶</span>
        <input type="range" min="1" max="10" value="6" id="intensity-slider" oninput="updateSlider(this)">
        <span class="slider-label">🔥</span>
        <span class="intensity-val" id="intensity-val">6</span>
      </div>
    </div>

    <!-- NOTE -->
    <div id="note-wrap" style="display:none; margin-top:1rem;">
      <p class="card-title" style="margin-bottom:6px">📝 Mau cerita dikit?</p>
      <textarea class="note-input" id="note-input" placeholder="tulis apa aja... ga ada yang judge kok 🤍"></textarea>
    </div>

    <div id="save-wrap" style="display:none; margin-top:1rem;">
      <button class="btn-save" id="btn-save" onclick="saveLog()">Simpan mood aku! 🌸</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="card">
    <p class="card-title">🗓️ Riwayat mood <button class="btn-clear" onclick="clearHistory()">hapus semua</button></p>
    <div id="history-list">
      <div class="history-empty"><span>🌙</span>belum ada log nih, yuk mulai!</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
var STORAGE_KEY = 'mood_logs_v1';
var selectedMood = null;

var moodData = {
  happy:   { emoji:'😄', color:'#fbbf24', bg:'#fef9c3', label:'Happy',   responses: ['Waaah seneng banget deh liat kamu happy!~ 🌟','Senyum kamu pasti bikin orang sekitar ikut bahagia 🌸','Hari yang bagus! Abadiin perasaan ini yaaa 💛'] },
  love:    { emoji:'🥰', color:'#f472b6', bg:'#fce7f3', label:'Sayang',  responses: ['Aww kamu lagi ngerasain hangatnya perasaan itu ya 🫶','Siapa nih yang bikin hati kamu meleleh? 👀💕','Perasaan ini mau disimpen apa dibagi? Hehe~'] },
  excited: { emoji:'🤩', color:'#fb923c', bg:'#fff7ed', label:'Excited',  responses: ['YAYYY vibes kamu hari ini 10/10! 🎉','Ada event apa nih? Ceritaaa dong! 🥳','Energi kamu hari ini bisa ngisi ulang semua orang~ 🔆'] },
  calm:    { emoji:'😌', color:'#60a5fa', bg:'#eff6ff', label:'Tenang',   responses: ['Adem banget rasanya... kayak abis minum teh hangat ☕','Tenang itu mahal loh, nikmatin yaaa 💙','Slow life gang! Istirahat yang cukup yaaa~'] },
  sad:     { emoji:'😢', color:'#a78bfa', bg:'#f3e8ff', label:'Sedih',    responses: ['Gapapa nangis dulu, itu manusiawi banget 💜','Aku di sini dengerin kamu ya~ semangat!','Sedih itu boleh, tapi jangan lupa bahwa ini juga pasti berlalu 🌈'] },
  anxious: { emoji:'😰', color:'#34d399', bg:'#ecfdf5', label:'Cemas',    responses: ['Tarik napas dulu... pelan-pelan ya 🍃','Cemas itu tandanya kamu peduli, tapi jangan terlalu dibawa ya 💚','Coba tulis yang bikin cemas, kadang itu bantu banget!'] },
  tired:   { emoji:'😴', color:'#94a3b8', bg:'#f1f5f9', label:'Ngantuk',  responses: ['TIDUR DULU SANA! 😤 Istirahat itu penting~','Tubuh kamu lagi minta jatah tidurnya nih hehe','Kopi ke-berapa ini? Udah cukup, ayo rebahan! 🛏️'] },
  angry:   { emoji:'😤', color:'#f87171', bg:'#fef2f2', label:'Kesal',    responses: ['Ugh... sabar yaaa, napas dulu 🌬️','Boleh marah, asal jangan sampe nyesel habis itu ya 🤍','Kalau udah agak tenang, coba cerita ke seseorang yang kamu percaya 💬'] },
};

var tips = {
  happy:   '💡 Abadiin momen ini! Foto atau tulis diary yuk~',
  love:    '💡 Ungkapin perasaan kamu ke orang itu!',
  excited: '💡 Salurkan energi ini ke hal produktif!',
  calm:    '💡 Meditasi 5 menit bisa pertahanin mood ini~',
  sad:     '💡 Dengerin musik favorit atau hubungi temen~',
  anxious: '💡 Teknik 4-7-8: tarik napas 4 detik, tahan 7, buang 8.',
  tired:   '💡 Power nap 20 menit lebih efektif dari kopi loh!',
  angry:   '💡 Tulis di kertas lalu buang — surprisingly works!',
};

function getLogs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}
function saveLogs(logs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
}

function selectMood(btn, mood) {
  document.querySelectorAll('.mood-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  selectedMood = mood;

  var d = moodData[mood];
  var resp = d.responses[Math.floor(Math.random() * d.responses.length)];
  var box = document.getElementById('response-box');
  box.style.background = d.bg;
  box.innerHTML =
    '<span class="resp-emoji">' + d.emoji + '</span>' +
    '<p class="resp-title" style="color:' + d.color + '">' + d.label + ' banget nih~</p>' +
    '<p class="resp-body">' + resp + '</p>' +
    '<span class="resp-tip" style="background:' + d.color + '22;color:' + d.color + '">' + tips[mood] + '</span>';
  box.className = 'response-box show';

  document.getElementById('slider-wrap').style.display = 'block';
  document.getElementById('note-wrap').style.display = 'block';
  document.getElementById('save-wrap').style.display = 'block';

  btn.style.animation = 'none';
  void btn.offsetWidth;
  btn.style.animation = 'moodPick 0.4s cubic-bezier(0.34,1.56,0.64,1)';
}

function updateSlider(el) {
  var v = el.value;
  el.style.setProperty('--val', (v/10*100) + '%');
  document.getElementById('intensity-val').textContent = v;
}

function saveLog() {
  if (!selectedMood) return;
  var logs = getLogs();
  var now = new Date();
  logs.unshift({
    mood: selectedMood,
    intensity: parseInt(document.getElementById('intensity-slider').value),
    note: document.getElementById('note-input').value.trim(),
    time: now.toISOString(),
  });
  if (logs.length > 50) logs = logs.slice(0, 50);
  saveLogs(logs);

  document.querySelectorAll('.mood-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('response-box').className = 'response-box';
  document.getElementById('slider-wrap').style.display = 'none';
  document.getElementById('note-wrap').style.display = 'none';
  document.getElementById('save-wrap').style.display = 'none';
  document.getElementById('note-input').value = '';
  document.getElementById('intensity-slider').value = 6;
  updateSlider(document.getElementById('intensity-slider'));
  selectedMood = null;

  renderHistory();
  renderStats();
  showToast('Mood tersimpan! ' + moodData[selectedMood || 'happy'].emoji + ' 🌸');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

function renderHistory() {
  var logs = getLogs();
  var el = document.getElementById('history-list');
  if (!logs.length) {
    el.innerHTML = '<div class="history-empty"><span>🌙</span>belum ada log nih, yuk mulai!</div>';
    return;
  }
  el.innerHTML = logs.map(function(log) {
    var d = moodData[log.mood];
    var t = new Date(log.time);
    var timeStr = t.toLocaleDateString('id-ID',{day:'numeric',month:'short'}) + ' · ' + t.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    return '<div class="log-item">' +
      '<div class="log-emoji-wrap" style="background:' + d.bg + '">' + d.emoji + '</div>' +
      '<div class="log-info">' +
        '<div class="log-top"><span class="log-mood-name">' + d.label + '</span><span class="log-time">' + timeStr + '</span></div>' +
        '<div class="log-bar-wrap"><div class="log-bar" style="width:' + (log.intensity*10) + '%"></div></div>' +
        (log.note ? '<div class="log-note">"' + log.note + '"</div>' : '') +
      '</div>' +
      '</div>';
  }).join('');
}

function renderStats() {
  var logs = getLogs();
  document.getElementById('stat-total').textContent = logs.length;
  var today = new Date().toDateString();
  var todayLogs = logs.filter(function(l){ return new Date(l.time).toDateString() === today; });
  document.getElementById('stat-today').textContent = todayLogs.length;

  if (logs.length) {
    var freq = {};
    logs.forEach(function(l){ freq[l.mood] = (freq[l.mood]||0)+1; });
    var top = Object.keys(freq).sort(function(a,b){ return freq[b]-freq[a]; })[0];
    document.getElementById('stat-fav').textContent = moodData[top].emoji;
  }

  var streak = calcStreak(logs);
  document.getElementById('streak-num').textContent = streak + ' hari';
}

function calcStreak(logs) {
  if (!logs.length) return 0;
  var days = {};
  logs.forEach(function(l){
    var d = new Date(l.time).toDateString();
    days[d] = true;
  });
  var streak = 0;
  var cur = new Date();
  while (true) {
    if (days[cur.toDateString()]) { streak++; cur.setDate(cur.getDate()-1); }
    else break;
  }
  return streak;
}

function clearHistory() {
  if (!confirm('Yakin mau hapus semua riwayat mood? 🥺')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderHistory();
  renderStats();
  showToast('Riwayat dihapus 🌸');
}

function initDate() {
  var now = new Date();
  var opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
  document.getElementById('date-chip').textContent = '📅 ' + now.toLocaleDateString('id-ID', opts);
}

// Init slider CSS var
document.getElementById('intensity-slider').style.setProperty('--val','60%');

initDate();
renderHistory();
renderStats();
</script>

@keyframes moodPick {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.25) rotate(-5deg); }
  70%  { transform: scale(0.9) rotate(3deg); }
  100% { transform: scale(1.08) rotate(0); }
}
</style>
