<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aku Cantik Kan? 🥺</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-50: #fff0f6;
    --pink-100: #ffd6e8;
    --pink-200: #ffadd4;
    --pink-300: #f783b0;
    --pink-400: #e8659a;
    --pink-500: #cc4b80;
    --cream: #fff8f0;
    --peach: #ffe5d0;
    --lavender: #f0eaff;
    --mint: #e0f7f0;
    --text-dark: #5a2a42;
    --text-mid: #9b607a;
    --text-soft: #c9a0b4;
    --shadow-pink: 0 8px 32px rgba(232,101,154,0.18);
    --shadow-soft: 0 4px 20px rgba(200,80,140,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--pink-50);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Floating background deco */
  .bg-deco {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    opacity: 0.18;
    animation: drift linear infinite;
  }

  @keyframes drift {
    0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.18; }
    90%  { opacity: 0.18; }
    100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
  }

  /* Card */
  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    background: #fff;
    border-radius: 32px;
    padding: 2.5rem 2.25rem 2rem;
    width: min(92vw, 400px);
    text-align: center;
    box-shadow: var(--shadow-pink), 0 1px 0 rgba(255,255,255,0.9) inset;
    border: 1.5px solid var(--pink-100);
    animation: cardIn 0.65s cubic-bezier(0.34,1.56,0.64,1) both;
    position: relative;
    overflow: visible;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.88); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Decorative dots on card corners */
  .card::before {
    content: '✿';
    position: absolute;
    top: -14px; left: -10px;
    font-size: 26px;
    animation: spinSlow 6s linear infinite;
    color: var(--pink-300);
  }
  .card::after {
    content: '✦';
    position: absolute;
    bottom: -10px; right: -8px;
    font-size: 20px;
    animation: spinSlow 8s linear infinite reverse;
    color: var(--pink-200);
  }
  @keyframes spinSlow { to { transform: rotate(360deg); } }

  /* Avatar face */
  .avatar {
    width: 90px; height: 90px;
    margin: 0 auto 1.25rem;
    position: relative;
  }
  .avatar-circle {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(145deg, #ffe0ef, #ffc8e0);
    border: 3px solid var(--pink-200);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    position: relative;
    box-shadow: 0 4px 16px rgba(232,101,154,0.22);
    animation: avatarFloat 3s ease-in-out infinite;
  }
  @keyframes avatarFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  .av-eyes { display: flex; gap: 14px; margin-bottom: 7px; }
  .av-eye {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--text-dark);
    position: relative;
    animation: blink 4s ease-in-out infinite;
  }
  .av-eye.r { animation-delay: 0.12s; }
  @keyframes blink {
    0%,90%,100% { transform: scaleY(1); }
    95% { transform: scaleY(0.05); }
  }
  .av-eye::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
  }
  .av-blush {
    position: absolute;
    width: 16px; height: 10px;
    border-radius: 50%;
    background: var(--pink-300);
    opacity: 0.45;
    bottom: 22px;
  }
  .av-blush.l { left: 11px; }
  .av-blush.r { right: 11px; }
  .av-mouth {
    width: 22px; height: 11px;
    border-radius: 0 0 22px 22px;
    border: 2.5px solid var(--text-dark);
    border-top: none;
    transition: all 0.3s;
  }

  /* Star badge above avatar */
  .badge {
    position: absolute;
    top: -8px; right: -8px;
    background: var(--pink-300);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 20px;
    letter-spacing: 0.3px;
    box-shadow: 0 2px 8px rgba(232,101,154,0.3);
    animation: badgePop 0.5s 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes badgePop {
    from { transform: scale(0) rotate(-20deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);   opacity: 1; }
  }

  /* Title */
  .q-title {
    font-family: 'Pacifico', cursive;
    font-size: 26px;
    color: var(--text-dark);
    margin-bottom: 0.35rem;
    line-height: 1.3;
  }
  .q-sub {
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 600;
    margin-bottom: 2rem;
    letter-spacing: 0.3px;
  }

  /* Yes button */
  .btn-yes {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 36px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px; font-weight: 800;
    cursor: pointer;
    border: none;
    background: linear-gradient(135deg, var(--pink-300), var(--pink-400));
    color: #fff;
    box-shadow: 0 4px 16px rgba(232,101,154,0.38), 0 1px 0 rgba(255,255,255,0.25) inset;
    transition: transform 0.15s, box-shadow 0.15s;
    animation: yesFloat 2s ease-in-out infinite;
    letter-spacing: 0.2px;
  }
  @keyframes yesFloat {
    0%,100% { box-shadow: 0 4px 16px rgba(232,101,154,0.38), 0 1px 0 rgba(255,255,255,0.25) inset; }
    50%      { box-shadow: 0 8px 28px rgba(232,101,154,0.48), 0 1px 0 rgba(255,255,255,0.25) inset; }
  }
  .btn-yes:hover { transform: scale(1.06) translateY(-2px); }
  .btn-yes:active { transform: scale(0.96); }

  /* No zone */
  .no-zone {
    position: relative;
    width: 100%;
    height: 56px;
    margin-top: 14px;
  }
  .btn-no {
    position: absolute;
    padding: 10px 22px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    border: 2px dashed var(--pink-200);
    background: var(--pink-50);
    color: var(--text-soft);
    left: 50%; top: 6px;
    transform: translateX(-50%);
    white-space: nowrap;
    transition: left 0.32s cubic-bezier(0.34,1.56,0.64,1),
                top  0.32s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* Miss message */
  .miss-msg {
    min-height: 20px;
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 700;
    margin-top: 10px;
    letter-spacing: 0.2px;
  }

  /* Decorative strip */
  .deco-strip {
    display: flex; gap: 8px; justify-content: center;
    margin-top: 1.5rem;
    font-size: 14px;
    opacity: 0.45;
    letter-spacing: 6px;
  }

  /* Result card */
  .result-card {
    background: #fff;
    border-radius: 32px;
    padding: 2.75rem 2.25rem;
    width: min(92vw, 400px);
    text-align: center;
    box-shadow: var(--shadow-pink);
    border: 1.5px solid var(--pink-100);
    animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .result-icon {
    font-size: 60px;
    display: block;
    margin-bottom: 1rem;
    animation: iconBounce 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes iconBounce {
    0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
    70%  { transform: scale(1.15) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .result-title {
    font-family: 'Pacifico', cursive;
    font-size: 24px;
    color: var(--text-dark);
    margin-bottom: 0.6rem;
  }
  .result-body {
    font-size: 14px;
    color: var(--text-mid);
    font-weight: 600;
    line-height: 1.75;
    margin-bottom: 1.75rem;
  }
  .btn-reset {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 11px 28px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px; font-weight: 800;
    cursor: pointer;
    border: 2px solid var(--pink-200);
    background: var(--pink-50);
    color: var(--text-mid);
    transition: background 0.15s, transform 0.12s;
  }
  .btn-reset:hover { background: var(--pink-100); transform: scale(1.04); }

  /* Floating emoji */
  .float-e {
    position: fixed;
    font-size: 20px;
    pointer-events: none;
    z-index: 99;
    animation: floatUp 0.9s ease forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(0.4); }
  }

  /* Ripple */
  .ripple {
    position: fixed;
    border-radius: 50%;
    border: 2.5px solid var(--pink-300);
    pointer-events: none;
    z-index: 98;
    animation: rippleOut 0.55s ease forwards;
  }
  @keyframes rippleOut {
    0%   { transform: scale(0); opacity: 0.7; width: 20px; height: 20px; margin: -10px; }
    100% { transform: scale(5); opacity: 0; }
  }

  /* Confetti */
  .conf {
    position: fixed;
    border-radius: 3px;
    pointer-events: none;
    z-index: 99;
    animation: confFall linear forwards;
  }
  @keyframes confFall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(320px) rotate(720deg) scale(0.2); }
  }

  /* Button animation classes */
  @keyframes aBounce { 0%{transform:scale(1)} 40%{transform:scale(1.22)} 70%{transform:scale(0.88)} 100%{transform:scale(1)} }
  @keyframes aWobble { 0%{transform:rotate(0)} 20%{transform:rotate(-10deg)} 50%{transform:rotate(9deg)} 75%{transform:rotate(-5deg)} 100%{transform:rotate(0)} }
  @keyframes aJelly  { 0%,100%{transform:scaleX(1) scaleY(1)} 30%{transform:scaleX(1.28) scaleY(0.75)} 60%{transform:scaleX(0.82) scaleY(1.18)} }
  @keyframes aSpin   { 0%{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(0.8)} 100%{transform:rotate(360deg) scale(1)} }
  @keyframes aFlip   { 0%{transform:perspective(400px) rotateY(0)} 50%{transform:perspective(400px) rotateY(90deg) scale(0.8)} 100%{transform:perspective(400px) rotateY(0)} }
  @keyframes aShake  { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-5px)} }

  .an-bounce { animation: aBounce 0.42s ease both !important; }
  .an-wobble { animation: aWobble 0.42s ease both !important; }
  .an-jelly  { animation: aJelly  0.42s ease both !important; }
  .an-spin   { animation: aSpin   0.42s ease both !important; }
  .an-flip   { animation: aFlip   0.42s ease both !important; }
  .an-shake  { animation: aShake  0.38s ease both !important; }

/* Custom cute cursor */
body, * {
  cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMicgaGVpZ2h0PSczMicgdmlld0JveD0nMCAwIDMyIDMyJz48dGV4dCB5PScyNicgZm9udC1zaXplPScyNic+8J+MuDwvdGV4dD48L3N2Zz4=") 12 28, auto !important;
}
button, a, [onclick], input, textarea, select, label {
  cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMicgaGVpZ2h0PSczMicgdmlld0JveD0nMCAwIDMyIDMyJz48dGV4dCB5PScyNicgZm9udC1zaXplPScyNic+4pyoPC90ZXh0Pjwvc3ZnPg==") 12 28, pointer !important;
}
</style>
</head>
<body>

<div class="bg-deco" id="bg-deco"></div>

<div class="scene" id="scene">
  <div class="card" id="main-card">
    <div class="avatar">
      <div class="avatar-circle">
        <div class="av-eyes">
          <div class="av-eye l"></div>
          <div class="av-eye r"></div>
        </div>
        <div class="av-mouth" id="av-mouth"></div>
        <div class="av-blush l"></div>
        <div class="av-blush r"></div>
      </div>
      <div class="badge">✨ hei!</div>
    </div>
    <p class="q-title">Aku cantik kan? 🥺</p>
    <p class="q-sub">jawab jujur yaaa~</p>
    <button class="btn-yes" onclick="answerYes()">
      <span>Iya dong!</span><span>😍</span>
    </button>
    <div class="no-zone" id="no-zone">
      <button class="btn-no" id="btn-no">Nggak... 😐</button>
    </div>
    <p class="miss-msg" id="miss-msg"></p>
    <div class="deco-strip">♡ ♡ ♡ ♡ ♡</div>
  </div>
</div>

<script>
var missCount = 0, noClicked = false, animating = false;
var anims = ['an-bounce','an-wobble','an-jelly','an-spin','an-flip','an-shake'];
var floatEmojis = ['💨','🏃','😅','👀','🤭','😂','✨','💫','🌸'];
var missLines = [
  'eh mau kemana? 😏',
  'hehe lari terus~',
  'capek belum? 😂',
  'tombolnya malu nih~',
  'hampir kena... atau ga? 🤭',
  'tangan gemetar ya?',
  'wkwk masih semangat?',
  'udah jauh banget tuh~',
  'oke fine kamu keren juga 😤',
];

function initBubbles() {
  var bd = document.getElementById('bg-deco');
  var colors = ['#ffc8e0','#f783b0','#ffd6e8','#f0eaff','#ffe5d0','#e0f7f0'];
  for (var i = 0; i < 14; i++) {
    var b = document.createElement('div');
    b.className = 'bubble';
    var size = 30 + Math.random() * 80;
    b.style.cssText = [
      'width:'+size+'px','height:'+size+'px',
      'background:'+colors[Math.floor(Math.random()*colors.length)],
      'left:'+(Math.random()*100)+'%',
      'animation-duration:'+(10+Math.random()*16)+'s',
      'animation-delay:-'+(Math.random()*12)+'s',
    ].join(';');
    bd.appendChild(b);
  }
}

function attachBtn() {
  var b = document.getElementById('btn-no');
  if (!b) return;
  b.addEventListener('mouseenter', onHover);
  b.addEventListener('touchstart', function(e){ e.preventDefault(); onHover(); }, {passive:false});
  b.addEventListener('click', onClickNo);
}

function onHover() {
  if (noClicked || animating) return;
  if (Math.random() < 0.05) return;
  doRunAway();
}

function onClickNo() {
  if (noClicked) return;
  if (Math.random() < 0.05) { noClicked = true; answerNo(); return; }
  doRunAway();
}

function doRunAway() {
  animating = true;
  missCount++;
  var b = document.getElementById('btn-no');
  var zone = document.getElementById('no-zone');
  var miss = document.getElementById('miss-msg');
  if (!b || !zone) return;

  var zw = zone.clientWidth, bw = b.offsetWidth;
  var maxX = Math.max(0, zw - bw);
  var nx = Math.floor(Math.random() * maxX);
  var ny = Math.floor(Math.random() * 8);

  b.style.left = nx + 'px';
  b.style.top  = ny + 'px';
  b.style.transform = 'translateX(0)';

  var anim = anims[Math.floor(Math.random() * anims.length)];
  anims.forEach(function(a){ b.classList.remove(a); });
  void b.offsetWidth;
  b.classList.add(anim);

  if (missCount >= 7) { b.style.fontSize = '11px'; b.style.padding = '7px 12px'; b.style.opacity = '0.4'; }

  var line = missLines[Math.min(missCount - 1, missLines.length - 1)];
  if (missCount > missLines.length) line = 'udah ' + missCount + 'x kabur~ 😏';
  miss.textContent = line;

  var bRect = b.getBoundingClientRect();
  spawnFloatEmoji(bRect);
  spawnRipple(bRect);

  setTimeout(function(){ animating = false; }, 450);
}

function spawnFloatEmoji(rect) {
  var e = document.createElement('div');
  e.className = 'float-e';
  e.textContent = floatEmojis[Math.floor(Math.random() * floatEmojis.length)];
  e.style.left = (rect.left + rect.width/2 - 10) + 'px';
  e.style.top  = (rect.top - 4) + 'px';
  document.body.appendChild(e);
  setTimeout(function(){ e.remove(); }, 950);
}

function spawnRipple(rect) {
  var r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = (rect.left + rect.width/2) + 'px';
  r.style.top  = (rect.top + rect.height/2) + 'px';
  document.body.appendChild(r);
  setTimeout(function(){ r.remove(); }, 600);
}

function answerYes() {
  fadeCard(function(){
    document.getElementById('scene').innerHTML =
      '<div class="result-card">' +
      '<span class="result-icon">🎉</span>' +
      '<p class="result-title">Makasih banyak!!</p>' +
      '<p class="result-body">Kamu yang paling jujur sedunia 🌸<br>Appreciate banget udah jawab dengan hati nurani!</p>' +
      '<button class="btn-reset" onclick="resetGame()">↩ &nbsp;Coba lagi~</button>' +
      '</div>';
    spawnConfetti();
  });
}

function answerNo() {
  var roast = missCount > 0
    ? 'Udah ' + missCount + 'x ngeles tapi tetap bilang nggak juga... OK fine. FINE. 😤'
    : 'Kamu berhasil klik tombol paling susah di dunia. Selamat? Mungkin? 😭';
  fadeCard(function(){
    document.getElementById('scene').innerHTML =
      '<div class="result-card">' +
      '<span class="result-icon">😭</span>' +
      '<p class="result-title">Oalah...</p>' +
      '<p class="result-body">' + roast + '</p>' +
      '<button class="btn-reset" onclick="resetGame()">↩ &nbsp;Coba lagi~</button>' +
      '</div>';
  });
}

function fadeCard(cb) {
  var c = document.getElementById('main-card');
  if (!c) { cb(); return; }
  c.style.transition = 'opacity 0.25s, transform 0.25s';
  c.style.opacity = '0'; c.style.transform = 'scale(0.9) translateY(10px)';
  setTimeout(cb, 270);
}

function spawnConfetti() {
  var colors = ['#f4c0d1','#ed93b1','#fac775','#9fe1cb','#b5d4f4','#afa9ec','#f09595','#5dcaa5','#ffadd4'];
  for (var i = 0; i < 48; i++) {
    (function(i){
      setTimeout(function(){
        var d = document.createElement('div');
        d.className = 'conf';
        var size = 5 + Math.random() * 8;
        d.style.cssText = [
          'left:'+(3+Math.random()*94)+'vw',
          'top:-16px',
          'width:'+size+'px','height:'+size+'px',
          'background:'+colors[Math.floor(Math.random()*colors.length)],
          'animation-duration:'+(0.9+Math.random()*0.8)+'s',
          'animation-delay:'+(Math.random()*0.6)+'s',
          'border-radius:'+(Math.random()>0.5?'50%':'3px'),
        ].join(';');
        document.body.appendChild(d);
        setTimeout(function(){ d.remove(); }, 1800);
      }, i * 22);
    })(i);
  }
}

function resetGame() {
  missCount = 0; noClicked = false; animating = false;
  document.getElementById('scene').innerHTML =
    '<div class="card" id="main-card">' +
    '<div class="avatar"><div class="avatar-circle">' +
    '<div class="av-eyes"><div class="av-eye l"></div><div class="av-eye r"></div></div>' +
    '<div class="av-mouth"></div>' +
    '<div class="av-blush l"></div><div class="av-blush r"></div>' +
    '</div><div class="badge">✨ hei!</div></div>' +
    '<p class="q-title">Aku cantik kan? 🥺</p>' +
    '<p class="q-sub">jawab jujur yaaa~</p>' +
    '<button class="btn-yes" onclick="answerYes()"><span>Iya dong!</span><span>😍</span></button>' +
    '<div class="no-zone" id="no-zone"><button class="btn-no" id="btn-no">Nggak... 😐</button></div>' +
    '<p class="miss-msg" id="miss-msg"></p>' +
    '<div class="deco-strip">♡ ♡ ♡ ♡ ♡</div>' +
    '</div>';
  attachBtn();
}

initBubbles();
attachBtn();
</script>
</body>
</html>
