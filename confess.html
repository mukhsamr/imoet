<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confess Generator 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #fffaf5;
  --pink: #f472b6;
  --pink-light: #fce7f3;
  --pink-pale: #fdf2f8;
  --pink-dark: #db2777;
  --purple: #c084fc;
  --purple-light: #f3e8ff;
  --red: #fb7185;
  --red-light: #fff1f2;
  --yellow: #fbbf24;
  --yellow-light: #fef9c3;
  --text: #3b1f2b;
  --text-mid: #8b5a6e;
  --text-soft: #c4a0b4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--cream);
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 2.5rem 1.25rem 5rem;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 15% 20%, #fce7f380 0%, transparent 45%),
    radial-gradient(ellipse at 88% 82%, #f3e8ff60 0%, transparent 45%),
    radial-gradient(ellipse at 60% 5%,  #fef9c340 0%, transparent 35%);
  pointer-events: none; z-index: 0;
}

.bubble { position:fixed; border-radius:50%; opacity:0.1; pointer-events:none; z-index:0; animation:bubbleDrift linear infinite; }
@keyframes bubbleDrift {
  0%   { transform:translateY(110vh) rotate(0deg); opacity:0; }
  8%   { opacity:0.1; }
  92%  { opacity:0.1; }
  100% { transform:translateY(-20vh) rotate(360deg); opacity:0; }
}

.wrapper { position:relative; z-index:1; width:100%; max-width:520px; }

/* HEADER */
.header { text-align:center; margin-bottom:2rem; animation:heroIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes heroIn { from{opacity:0;transform:translateY(28px) scale(0.93)} to{opacity:1;transform:none} }
.header-tag {
  display:inline-block; background:var(--pink-light); color:var(--pink);
  font-size:11px; font-weight:900; padding:5px 16px; border-radius:20px;
  letter-spacing:1.5px; text-transform:uppercase; margin-bottom:0.9rem;
}
.header-title { font-family:'Pacifico',cursive; font-size:38px; color:var(--text); line-height:1.2; margin-bottom:0.4rem; }
.header-title span { background:linear-gradient(135deg,var(--pink),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.header-sub { font-size:13px; color:var(--text-soft); font-weight:700; line-height:1.6; }
.header-deco { font-size:13px; color:var(--text-soft); opacity:0.5; letter-spacing:8px; margin-top:1rem; }

/* CARD */
.card {
  background:#fff; border-radius:24px; padding:1.5rem 1.5rem 1.75rem;
  box-shadow:0 6px 28px rgba(244,114,182,0.12); border:1.5px solid #fce7f3;
  margin-bottom:1.25rem;
  animation:cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
}
.card:nth-child(2){animation-delay:0.08s}
.card:nth-child(3){animation-delay:0.16s}
@keyframes cardIn { from{opacity:0;transform:translateY(18px) scale(0.96)} to{opacity:1;transform:none} }

.card-label {
  font-size:11px; font-weight:900; color:var(--text-soft);
  letter-spacing:1.5px; text-transform:uppercase; margin-bottom:1rem;
}

/* INPUT */
.input-row { display:flex; flex-direction:column; gap:12px; }
.input-group { display:flex; flex-direction:column; gap:6px; }
.input-lbl { font-size:12px; font-weight:800; color:var(--text-mid); }
.input-field {
  width:100%;
  border:1.5px solid #fce7f3; border-radius:14px;
  padding:11px 14px;
  font-family:'Nunito',sans-serif; font-size:14px; font-weight:700;
  color:var(--text); background:var(--cream);
  outline:none; transition:border-color 0.15s, background 0.15s;
}
.input-field:focus { border-color:var(--pink); background:#fff; }
.input-field::placeholder { color:var(--text-soft); }

/* STYLE SELECTOR */
.style-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.style-btn {
  display:flex; align-items:center; gap:10px;
  padding:12px 14px;
  border-radius:16px; border:2px solid #fce7f3;
  background:var(--cream); cursor:pointer;
  transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1), border-color 0.15s, background 0.15s;
  outline:none;
}
.style-btn:hover { transform:scale(1.04) translateY(-1px); }
.style-btn.active { border-color:var(--pink); background:var(--pink-pale); }
.style-icon { font-size:22px; }
.style-info { text-align:left; }
.style-name { font-size:12px; font-weight:900; color:var(--text); }
.style-desc { font-size:10px; font-weight:700; color:var(--text-soft); margin-top:1px; }

/* GENERATE BUTTON */
.btn-gen {
  width:100%; padding:15px; border-radius:50px; border:none;
  background:linear-gradient(135deg, var(--pink), var(--purple));
  color:#fff; font-family:'Nunito',sans-serif;
  font-size:16px; font-weight:900; cursor:pointer;
  letter-spacing:0.3px;
  box-shadow:0 5px 22px rgba(244,114,182,0.38);
  transition:transform 0.18s, box-shadow 0.18s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-gen:hover { transform:translateY(-3px); box-shadow:0 10px 32px rgba(244,114,182,0.42); }
.btn-gen:active { transform:scale(0.97); }
.btn-gen:disabled { opacity:0.5; pointer-events:none; }

/* LETTER RESULT */
.letter-wrap {
  display:none;
  animation:letterReveal 0.65s cubic-bezier(0.34,1.56,0.64,1) both;
}
.letter-wrap.show { display:block; }
@keyframes letterReveal {
  from { opacity:0; transform:translateY(24px) scale(0.93) rotate(-1deg); }
  to   { opacity:1; transform:none; }
}

.letter-paper {
  border-radius:20px; padding:2rem 1.75rem;
  position:relative; overflow:hidden;
  box-shadow:0 8px 32px rgba(244,114,182,0.18);
  border:1.5px solid var(--pink-light);
}

/* Paper texture lines */
.letter-paper::before {
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(
    transparent,
    transparent 27px,
    rgba(244,114,182,0.07) 27px,
    rgba(244,114,182,0.07) 28px
  );
  pointer-events:none;
}
/* Left margin line */
.letter-paper::after {
  content:'';
  position:absolute; left:44px; top:0; bottom:0;
  width:1.5px; background:rgba(244,114,182,0.15);
  pointer-events:none;
}

.letter-deco-top {
  text-align:center; font-size:20px; letter-spacing:6px;
  margin-bottom:1.25rem; opacity:0.6;
}
.letter-from {
  font-size:11px; font-weight:900; color:var(--text-soft);
  letter-spacing:1px; text-transform:uppercase;
  margin-bottom:1.25rem;
}
.letter-body {
  font-family:'Dancing Script', cursive;
  font-size:18px; line-height:1.85;
  color:var(--text);
  white-space:pre-wrap;
  position:relative; z-index:1;
}
.letter-sign {
  font-family:'Dancing Script', cursive;
  font-size:20px; font-weight:700;
  color:var(--pink);
  margin-top:1.25rem;
  display:block;
  text-align:right;
}
.letter-deco-bot {
  text-align:center; font-size:16px; letter-spacing:4px;
  margin-top:1.25rem; opacity:0.5;
}

/* ACTION BUTTONS */
.action-row { display:flex; gap:10px; margin-top:1rem; }
.btn-action {
  flex:1; padding:11px 10px; border-radius:50px;
  font-family:'Nunito',sans-serif; font-size:13px; font-weight:800;
  cursor:pointer; border:2px solid var(--pink-light);
  background:var(--pink-pale); color:var(--text-mid);
  transition:background 0.15s, transform 0.15s;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-action:hover { background:var(--pink-light); transform:scale(1.03); }
.btn-action.primary { background:var(--pink); border-color:var(--pink-dark); color:#fff; }
.btn-action.primary:hover { background:var(--pink-dark); }

/* LOADER DOTS */
.dots { display:inline-flex; gap:5px; }
.dot-a { width:7px; height:7px; border-radius:50%; background:#fff; animation:dotBounce 0.7s ease-in-out infinite; }
.dot-a:nth-child(2){ animation-delay:0.12s }
.dot-a:nth-child(3){ animation-delay:0.24s }
@keyframes dotBounce { 0%,80%,100%{transform:scale(0.6);opacity:0.5} 40%{transform:scale(1.1);opacity:1} }

/* TOAST */
.toast {
  position:fixed; bottom:2rem; left:50%;
  transform:translateX(-50%) translateY(70px);
  background:var(--text); color:#fff;
  font-family:'Nunito',sans-serif; font-size:13px; font-weight:800;
  padding:10px 22px; border-radius:50px; z-index:999;
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
  opacity:0; pointer-events:none; white-space:nowrap;
}
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

/* HEARTS floating */
.heart-float {
  position:fixed; pointer-events:none; z-index:50;
  font-size:18px; animation:heartUp 1.2s ease forwards;
}
@keyframes heartUp {
  0%  { opacity:1; transform:translateY(0) scale(1) rotate(-10deg); }
  100%{ opacity:0; transform:translateY(-120px) scale(0.3) rotate(20deg); }
}
</style>
</head>
<body>
<div id="bubbles"></div>

<div class="wrapper">

  <!-- HEADER -->
  <div class="header">
    <span class="header-tag">💌 confess generator</span>
    <h1 class="header-title">Ungkapin <span>Perasaan</span> Kamu 🥺</h1>
    <p class="header-sub">isi namanya, pilih gaya suratnya,<br>dan biarkan kita yang nulisin~ ✨</p>
    <div class="header-deco">♡ ♡ ♡ ♡ ♡</div>
  </div>

  <!-- FORM CARD -->
  <div class="card">
    <p class="card-label">✍️ isi dulu ya</p>
    <div class="input-row">
      <div class="input-group">
        <label class="input-lbl">Nama kamu 🌸</label>
        <input class="input-field" id="inp-from" type="text" placeholder="contoh: Rara, Dika, ...">
      </div>
      <div class="input-group">
        <label class="input-lbl">Nama yang mau di-confess 💘</label>
        <input class="input-field" id="inp-to" type="text" placeholder="contoh: Bintang, Naya, ...">
      </div>
      <div class="input-group">
        <label class="input-lbl">Hal yang kamu suka dari dia (opsional)</label>
        <input class="input-field" id="inp-thing" type="text" placeholder="contoh: senyumnya, cara dia ketawa, ...">
      </div>
    </div>
  </div>

  <!-- STYLE CARD -->
  <div class="card">
    <p class="card-label">🎨 pilih gaya surat</p>
    <div class="style-grid" id="style-grid">
      <button class="style-btn active" onclick="pickStyle(this,'manis')" data-s="manis">
        <span class="style-icon">🍬</span>
        <div class="style-info"><p class="style-name">Manis & Imut</p><p class="style-desc">penuh manja & kiyowo</p></div>
      </button>
      <button class="style-btn" onclick="pickStyle(this,'puitis')" data-s="puitis">
        <span class="style-icon">🌙</span>
        <div class="style-info"><p class="style-name">Puitis</p><p class="style-desc">dalam & penuh makna</p></div>
      </button>
      <button class="style-btn" onclick="pickStyle(this,'drama')" data-s="drama">
        <span class="style-icon">🎭</span>
        <div class="style-info"><p class="style-name">Lebay Drama</p><p class="style-desc">se-dramatis sinetron</p></div>
      </button>
      <button class="style-btn" onclick="pickStyle(this,'receh')" data-s="receh">
        <span class="style-icon">😂</span>
        <div class="style-info"><p class="style-name">Receh & Kocak</p><p class="style-desc">ngakak tapi tetap nembak</p></div>
      </button>
    </div>
  </div>

  <!-- GENERATE BTN -->
  <button class="btn-gen" id="btn-gen" onclick="generateLetter()">
    <span id="gen-label">Tulisin surat aku! 💌</span>
  </button>

  <!-- RESULT -->
  <div class="letter-wrap" id="letter-wrap" style="margin-top:1.25rem">
    <div class="card" style="padding:0; overflow:hidden; border:none;">
      <div class="letter-paper" id="letter-paper" style="background:#fff9fb">
        <div class="letter-deco-top" id="letter-deco-top">💌 ✦ 💌 ✦ 💌</div>
        <p class="letter-from" id="letter-from"></p>
        <div class="letter-body" id="letter-body"></div>
        <span class="letter-sign" id="letter-sign"></span>
        <div class="letter-deco-bot">♡ ♡ ♡</div>
      </div>
    </div>
    <div class="action-row">
      <button class="btn-action" onclick="generateLetter()">🔄 Ganti versi</button>
      <button class="btn-action" onclick="copyLetter()">📋 Salin surat</button>
      <button class="btn-action primary" onclick="shareLetter()">💌 Share!</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ── TEMPLATES ── */
var templates = {

  manis: [
    function(f,t,th){return "Hai {to} yang imut,\n\nAku ga tau harus mulai dari mana, tapi... aku suka sama kamu 🥺\n\nSerius deh. Setiap kali {to} ada di deket aku, rasanya jantung ini nge-skip satu ketukan. Apalagi {thing}itu bikin aku senyum-senyum sendiri kalo lagi inget.\n\nAku ga minta banyak. Boleh ga, aku jadi orang yang paling deket sama {to}? Yang selalu ada kalau {to} butuh temen cerita, atau cuma butuh seseorang yang dengerin?\n\nGa perlu dijawab sekarang. Tapi aku harap {to} tau... kamu spesial banget buat aku 💕"},
    function(f,t,th){return "Hai {to} 🌸\n\nUdah lama banget aku nahan perasaan ini. Tapi kayaknya kalo ditahan terus malah meledak hehe.\n\nJadi... aku suka sama {to}. Beneran. Bukan sekedar suka temen biasa, tapi yang bikin aku pengen chat kamu tiap hari, yang bikin aku senyum kalau liat nama {to} di notif HP aku.\n\n{thing} itu... haduh, makin bikin aku suka deh 😳\n\nAku ga tau {to} ngerasain yang sama atau enggak. Tapi setidaknya aku udah jujur. Dan itu udah cukup buat aku 🤍"},
  ],

  puitis: [
    function(f,t,th){return "Kepada {to},\n\nAda hal-hal yang sulit diucapkan tapi terlalu berat untuk disimpan sendirian.\n\nDan salah satunya adalah perasaan ini — yang sudah lama bersemayam diam-diam di sudut hatiku setiap kali namamu disebut.\n\n{thing} itu seperti puisi yang tak perlu kata-kata. Cukup hadir, dan dunia terasa berbeda.\n\nMungkin aku tidak tahu bagaimana cerita ini akan berakhir. Tapi aku tahu satu hal: bahwa perasaan yang tulus tidak pernah sia-sia, walau tak berbalas.\n\nDan perasaanku padamu, {to} — nyata adanya. 🌙"},
    function(f,t,th){return "Untuk {to},\n\nKatanya, ada orang-orang yang datang bukan untuk tinggal, melainkan untuk mengajarkan kita arti dari rindu.\n\nTapi kamu — kamu berbeda. Kamu hadir dan tanpa kusadari, kamu sudah mengisi ruang-ruang kosong yang bahkan tidak pernah aku tahu ada.\n\n{thing} itu seperti sajak pendek yang berulang terus di benakku — sederhana, namun membekas.\n\nAku tidak memintamu untuk membalas. Aku hanya ingin kamu tahu, bahwa di antara semua orang di dunia ini... hatiku memilihmu. 🌸"},
  ],

  drama: [
    function(f,t,th){return "OH {to}!!!\n\nAKU TIDAK SANGGUP LAGI MENYIMPAN INI SENDIRIAN!!! 😭😭\n\nSudah berhari-hari, berminggu-minggu, mungkin berbulan-bulan... aku berjuang melawan perasaan ini. Tapi TIDAK BISA. TIDAK MAMPU. MUSTAHIL.\n\nSetiap kali lihat {thing}, jantungku seolah berhenti berdetak. Dunia terasa berhenti berputar. Burung-burung di luar jendela pun ikut terdiam.\n\nApakah ini... CINTA?!\n\nIya. Itu cinta, {to}. Dan aku tidak mau menyangkalnya lagi!! Aku SUKA KAMU dan itu FINAL dan TIDAK BISA DIGANGGU GUGAT.\n\nTrima kasih sudah hadir dalam hidupku yang porak-poranda ini 😭✨"},
    function(f,t,th){return "Kepada {to} yang telah menghancurkan ketenangan hidupku,\n\nSEBELUM kamu ada, hidupku tenang. Damai. Tenteram.\n\nSESUDAH kamu ada... semua berubah 😭 HP selalu dipegang, notif selalu dicek, {thing} itu selalu muncul di ingatan tanpa izin.\n\nKamu TAHU tidak, betapa TERSIKSA-nya aku?! Setiap hari harus pura-pura biasa saja padahal di dalam dada ini ada badai kategori lima yang bernama P-E-R-A-S-A-A-N.\n\nJadi dengan ini aku nyatakan secara resmi, tertulis, bermeterai perasaan: AKU SUKA KAMU, {to}!! Dan kamu harus bertanggung jawab!! 😤💕"},
  ],

  receh: [
    function(f,t,th){return "Halo {to}, apa kabar organ jantungku yang suka deg-degan ini?\n\nJadi gini... aku mau lapor kejadian mencurigakan.\n\nBaik bukti pertama: setiap kali lihat {to}, senyum aku ga bisa direm. Bukti kedua: {thing} itu bikin aku langsung amnesia mau ngapain. Bukti ketiga: aku ngetik surat ini udah dihapus 7 kali tapi tetap jadi juga.\n\nKesimpulan dari laporan ini: aku suka sama kamu.\n\nSilakan tanggapi laporan ini dengan bijaksana. Kalau perlu, bisa dibalas dengan perasaan yang sama 😇 Kalau tidak... anggap aja ini salah kirim. Hehe. Bye. 👋😅"},
    function(f,t,th){return "Kepada Yth. {to},\n\nDengan hormat,\n\nBersama surat ini, saya {from} ingin menyampaikan bahwa saya telah terjangkit penyakit yang cukup serius. Gejalanya antara lain: senyum-senyum sendiri, susah tidur, dan HP sering dibuka padahal ga ada notif.\n\nSetelah dikonsultasikan ke dokter hati (bukan dokter spesialis ya, tapi dokter perasaan), hasilnya: saya kena BAPER AKUT yang penyebabnya adalah {to}.\n\nFaktor memperparah: {thing} itu bikin saya makin ga sembuh-sembuh.\n\nObat yang dianjurkan: satu 'iya' dari {to} sudah cukup untuk menyembuhkan saya sepenuhnya.\n\nHormat saya,\n{from} yang lagi baper parah 😂💕"},
  ],
};

var bgColors = {
  manis:  '#fff9fb',
  puitis: '#f8f4ff',
  drama:  '#fff5f7',
  receh:  '#fffbf0',
};
var decoTop = {
  manis:  '💌 ✦ 💌 ✦ 💌',
  puitis: '🌙 ✦ ⋆ ✦ 🌙',
  drama:  '💔 ✦ 💔 ✦ 💔',
  receh:  '😂 ✦ 💕 ✦ 😂',
};

var selectedStyle = 'manis';
var lastLetter = '';

function pickStyle(btn, style) {
  document.querySelectorAll('.style-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  selectedStyle = style;
}

function generateLetter() {
  var from  = document.getElementById('inp-from').value.trim() || 'Seseorang';
  var to    = document.getElementById('inp-to').value.trim();
  var thing = document.getElementById('inp-thing').value.trim();

  if (!to) {
    shakeInput('inp-to');
    showToast('Nama siapa dulu dong~ 😅');
    return;
  }

  var thingText = thing || 'semua hal tentang kamu';
  var pool = templates[selectedStyle];
  var tpl  = pool[Math.floor(Math.random() * pool.length)];
  var raw  = tpl(from, to, thingText);
  var text = raw
    .replace(/\{from\}/g, from)
    .replace(/\{to\}/g, to)
    .replace(/\{thing\}/g, thingText);

  lastLetter = text;

  // Show loading
  var btn = document.getElementById('btn-gen');
  var lbl = document.getElementById('gen-label');
  btn.disabled = true;
  lbl.innerHTML = '<span class="dots"><span class="dot-a"></span><span class="dot-a"></span><span class="dot-a"></span></span>';

  setTimeout(function(){
    btn.disabled = false;
    lbl.textContent = 'Tulisin lagi~ 💌';

    document.getElementById('letter-paper').style.background = bgColors[selectedStyle];
    document.getElementById('letter-deco-top').textContent = decoTop[selectedStyle];
    document.getElementById('letter-from').textContent = 'Untuk: ' + to + ' 💌';

    var bodyEl = document.getElementById('letter-body');
    bodyEl.textContent = '';
    document.getElementById('letter-sign').textContent = '— ' + from + ' 🌸';

    var wrap = document.getElementById('letter-wrap');
    wrap.className = 'letter-wrap';
    void wrap.offsetWidth;
    wrap.className = 'letter-wrap show';

    wrap.scrollIntoView({ behavior:'smooth', block:'nearest' });

    // Typewriter
    typeWriter(bodyEl, text, 0);

    spawnHearts();
  }, 900);
}

function typeWriter(el, text, i) {
  if (i < text.length) {
    el.textContent += text[i];
    setTimeout(function(){ typeWriter(el, text, i+1); }, 18);
  }
}

function copyLetter() {
  if (!lastLetter) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(lastLetter).then(function(){
      showToast('Surat disalin! Sekarang tinggal kirim 😏💌');
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = lastLetter;
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    ta.remove();
    showToast('Surat disalin! Sekarang tinggal kirim 😏💌');
  }
}

function shareLetter() {
  if (navigator.share && lastLetter) {
    navigator.share({ title:'Surat buat kamu 💌', text: lastLetter });
  } else {
    copyLetter();
  }
}

function shakeInput(id) {
  var el = document.getElementById(id);
  el.style.animation = 'none'; void el.offsetWidth;
  el.style.animation = 'shakeInput 0.4s ease';
  el.focus();
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

function spawnHearts() {
  var ems = ['💕','💖','💗','💓','✨','🌸','💌'];
  for (var i = 0; i < 8; i++) {
    (function(i){
      setTimeout(function(){
        var h = document.createElement('div');
        h.className = 'heart-float';
        h.textContent = ems[Math.floor(Math.random()*ems.length)];
        h.style.left = (10 + Math.random()*80) + '%';
        h.style.bottom = '20%';
        h.style.animationDelay = (Math.random()*0.4)+'s';
        document.body.appendChild(h);
        setTimeout(function(){ h.remove(); }, 1400);
      }, i * 120);
    })(i);
  }
}

/* BUBBLES */
var bc = ['#ffc8e0','#f783b0','#ddd6fe','#fef9c3','#fce7f3'];
var bd = document.getElementById('bubbles');
for (var i = 0; i < 10; i++) {
  var b = document.createElement('div'); b.className = 'bubble';
  var sz = 25 + Math.random()*65;
  b.style.cssText = 'width:'+sz+'px;height:'+sz+'px;background:'+bc[Math.floor(Math.random()*bc.length)]+';left:'+(Math.random()*100)+'%;animation-duration:'+(11+Math.random()*13)+'s;animation-delay:-'+(Math.random()*13)+'s';
  bd.appendChild(b);
}
</script>

@keyframes shakeInput {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  50%{transform:translateX(8px)}
  75%{transform:translateX(-5px)}
}
</style>
